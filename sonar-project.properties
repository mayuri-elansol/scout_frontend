# Required metadata
sonar.projectKey=S-SCT-03-SW-Scout-Frontend-1.0.0
sonar.projectName=S-SCT-03-SW-Scout-Frontend-1.0.0
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.tsx,**/__tests__/**,**/*.d.ts,.next/**,coverage/**

# Ignore all Storybook files
sonar.exclusions=**/*.stories.ts,**/*.stories.tsx


# Language-specific configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=eslint-report.json

# Optional: Encoding
sonar.sourceEncoding=UTF-8

# --------------------------------------------------
#  Disable PRNG security warning (typescript:S2245)
# --------------------------------------------------
sonar.issue.ignore.multicriteria=prng1
sonar.issue.ignore.multicriteria.prng1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.prng1.resourceKey=**/.ts,**/.tsx

# SonarQube server details (only needed if not configured in Jenkins)
# sonar.host.url=http://localhost:9000
# sonar.login=your_sonarqube_token